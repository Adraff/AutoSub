<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AutoSub</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- ============ ASISTENTE DE API KEY (primer uso) ============ -->
  <div id="wizard" class="overlay hidden">
    <div class="wizard-card">
      <div class="wizard-head">
        <div class="logo">AS</div>
        <div>
          <h1 data-i18n="wz.title"></h1>
          <p class="muted" data-i18n="wz.sub"></p>
        </div>
      </div>

      <div class="wizard-step" data-step="1">
        <h2><span class="num">1</span><span data-i18n="wz.s1.h"></span></h2>
        <p data-i18n-html="wz.s1.p1"></p>
        <p class="muted" data-i18n-html="wz.s1.p2"></p>
      </div>

      <div class="wizard-step hidden" data-step="2">
        <h2><span class="num">2</span><span data-i18n="wz.s2.h"></span></h2>
        <p data-i18n="wz.s2.p"></p>
        <button class="btn primary" id="wzOpenStudio" data-i18n="wz.s2.btn"></button>
        <p class="muted" data-i18n="wz.s2.note"></p>
      </div>

      <div class="wizard-step hidden" data-step="3">
        <h2><span class="num">3</span><span data-i18n="wz.s3.h"></span></h2>
        <ol class="steps">
          <li data-i18n-html="wz.s3.l1"></li>
          <li data-i18n-html="wz.s3.l2"></li>
          <li data-i18n-html="wz.s3.l3"></li>
        </ol>
        <p class="muted" data-i18n="wz.s3.note"></p>
      </div>

      <div class="wizard-step hidden" data-step="4">
        <h2><span class="num">4</span><span data-i18n="wz.s4.h"></span></h2>
        <div class="row">
          <input type="password" id="wzKey" placeholder="AIza..." autocomplete="off" spellcheck="false">
          <button class="btn icon" id="wzToggle" data-i18n-title="common.showHide">👁</button>
        </div>
        <button class="btn primary full" id="wzValidate" data-i18n="wz.validate"></button>
        <div id="wzStatus" class="status"></div>
      </div>

      <div class="wizard-nav">
        <button class="btn ghost" id="wzBack" data-i18n="wz.back"></button>
        <div class="dots"><span></span><span></span><span></span><span></span></div>
        <button class="btn" id="wzNext" data-i18n="wz.next"></button>
      </div>
      <button class="btn ghost skip" id="wzSkip" data-i18n="wz.skip"></button>
    </div>
  </div>

  <!-- ============ PESTAÑAS ============ -->
  <nav class="tabs">
    <button class="tab active" data-tab="gen" data-i18n="tab.gen"></button>
    <button class="tab" data-tab="edit" id="tabEdit" disabled data-i18n="tab.edit"></button>
    <button class="tab" data-tab="export" data-i18n="tab.export"></button>
    <button class="tab" data-tab="log"><span data-i18n="tab.log"></span><i id="logDot" class="dot hidden"></i></button>
    <button class="tab cfg" data-tab="settings" data-i18n-title="tab.settings.title">⚙<i id="keyDot" class="dot warn"></i></button>
  </nav>

  <main>
    <!-- ============ GENERAR ============ -->
    <section id="tab-gen" class="panel active">
      <div id="compInfo" class="info" data-i18n="gen.selectComp"></div>

      <div class="grid">
        <label class="f"><span data-i18n="gen.audio"></span>
          <select id="audioSource" data-i18n-title="gen.audio.title">
            <option value="comp" data-i18n="gen.audio.comp"></option>
            <option value="layer" data-i18n="gen.audio.layer"></option>
          </select>
        </label>
        <label class="f"><span data-i18n="gen.lang"></span>
          <select id="language">
            <option value="auto" data-i18n="lang.auto"></option>
            <option value="es" data-i18n="lang.es"></option>
            <option value="en" data-i18n="lang.en"></option>
            <option value="pt" data-i18n="lang.pt"></option>
            <option value="fr" data-i18n="lang.fr"></option>
            <option value="it" data-i18n="lang.it"></option>
            <option value="de" data-i18n="lang.de"></option>
            <option value="ca" data-i18n="lang.ca"></option>
          </select>
        </label>
        <label class="f"><span data-i18n="gen.boxWidth"></span>
          <div class="inline">
            <input type="number" id="boxWidth" min="50" step="10" value="1500">
            <button class="btn mini" id="boxWidth80" data-i18n-title="gen.box80">80%</button>
          </div>
        </label>
        <div class="f"><span data-i18n="gen.maxLines"></span>
          <div class="seg" id="maxLines">
            <button data-v="1">1</button><button data-v="2" class="on">2</button><button data-v="3">3</button><button data-v="4">4</button>
          </div>
        </div>
        <div class="f full" id="fontRow"><span><span data-i18n="gen.font"></span> <i class="muted" id="fontCount"></i></span>
          <div class="inline">
            <div class="fsel" id="fontSel">
              <button class="fsel-btn" id="fontBtn" type="button"><span class="fname" id="fontName" data-i18n="gen.fontLoading"></span><span class="caret">▾</span></button>
              <div class="fsel-pop hidden" id="fontPop">
                <input type="search" id="fontSearch" data-i18n-ph="gen.fontSearch" autocomplete="off" spellcheck="false">
                <div class="fsel-list" id="fontList"></div>
              </div>
            </div>
            <select id="fontStyle" class="fstyle"></select>
          </div>
        </div>
      </div>

      <div class="checks">
        <label data-i18n-title="gen.keepSilence.title"><input type="checkbox" id="keepSilence"> <span data-i18n="gen.keepSilence"></span></label>
        <label><input type="checkbox" id="bgBox"> <span data-i18n="gen.bgBox"></span></label>
        <label><input type="checkbox" id="stroke" checked> <span data-i18n="gen.stroke"></span></label>
        <label data-i18n-title="gen.shadow.title"><input type="checkbox" id="shadow"> <span data-i18n="gen.shadow"></span></label>
      </div>

      <details id="adv">
        <summary data-i18n="gen.adv"></summary>
        <div class="grid">
          <label class="f"><span data-i18n="gen.gapBreak"></span><input type="number" id="gapBreak" min="0.1" step="0.1" value="0.5"></label>
          <label class="f"><span data-i18n="gen.maxDuration"></span><input type="number" id="maxDuration" min="1" step="0.5" value="5"></label>
          <label class="f"><span data-i18n="gen.fontSize"></span><input type="number" id="fontSize" min="8" step="1" value="80"></label>
          <label class="f" data-i18n-title="gen.bottomPad.title"><span data-i18n="gen.bottomPad"></span><input type="number" id="bottomPad" min="0" step="5" value="150"></label>
        </div>
        <div class="checks">
          <label><input type="checkbox" id="breakPunct" checked> <span data-i18n="gen.breakPunct"></span></label>
          <label data-i18n-title="gen.vad.title"><input type="checkbox" id="vad" checked> <span data-i18n="gen.vad"></span></label>
          <label data-i18n-title="gen.trim.title"><input type="checkbox" id="trimSilence" checked> <span data-i18n="gen.trim"></span></label>
        </div>
      </details>

      <div class="msel" id="modelSel">
        <button class="msel-btn" id="modelBtn" data-i18n-title="gen.model.title">
          <i class="mdot"></i><span class="mname" id="modelName">—</span><span class="mtag" id="modelTag"></span><span class="caret">▾</span>
        </button>
        <div class="msel-list hidden" id="modelList"></div>
      </div>
      <div class="actionbar">
        <button class="btn primary grow-btn" id="btnGenerate" data-i18n="gen.btnLiteral" data-i18n-title="gen.btnLiteral.title"></button>
        <button class="btn accent2 grow-btn" id="btnInterpret" data-i18n="gen.btnInterp" data-i18n-title="gen.btnInterp.title"></button>
        <button class="btn icon" id="btnReflow" data-i18n-title="gen.reflow.title">↻</button>
      </div>

      <div class="quota" id="quota">
        <div class="qbar"><div class="qfill" id="qFill"></div></div>
        <span class="qtext" id="qText">—</span>
      </div>

      <div id="job" class="job hidden">
        <div class="job-row"><span id="jobText"></span><span id="jobPct"></span></div>
        <div class="progress"><div class="bar" id="jobBar"></div></div>
      </div>
    </section>

    <!-- ============ EDITAR ============ -->
    <section id="tab-edit" class="panel">
      <div class="toolbar">
        <input type="search" id="subSearch" data-i18n-ph="edit.search">
        <button class="btn" id="btnAddSub" data-i18n="edit.addHere" data-i18n-title="edit.addHere.title"></button>
        <button class="btn icon" id="btnLoadSubs" data-i18n-title="edit.reload.title">⟳</button>
        <button class="btn primary" id="btnSaveSubs" data-i18n="edit.save"></button>
      </div>
      <div id="subChanged" class="notice hidden" data-i18n-html="edit.changed"></div>
      <div id="subList" class="sublist"><p class="muted" data-i18n="edit.none"></p></div>
      <p class="hint" data-i18n-html="edit.hint"></p>
    </section>

    <!-- ============ EXPORTAR ============ -->
    <section id="tab-export" class="panel">
      <div class="grid">
        <label class="f"><span data-i18n="exp.format"></span>
          <select id="exportFormat">
            <option value="srt">SRT</option>
            <option value="vtt">WebVTT</option>
            <option value="txt" data-i18n="exp.txt"></option>
            <option value="json" data-i18n="exp.json"></option>
          </select>
        </label>
        <label class="f"><span data-i18n="exp.origin"></span>
          <select id="exportOrigin">
            <option value="comp" data-i18n="exp.origin.comp"></option>
            <option value="workarea" data-i18n="exp.origin.wa"></option>
          </select>
        </label>
      </div>
      <div class="checks"><label><input type="checkbox" id="exportOneLine"> <span data-i18n="exp.oneLine"></span></label></div>
      <button class="btn primary full" id="btnExport" data-i18n="exp.btn"></button>
      <div id="exportStatus" class="status"></div>
    </section>

    <!-- ============ LOG ============ -->
    <section id="tab-log" class="panel">
      <div class="toolbar">
        <span class="muted grow" data-i18n="log.desc"></span>
        <button class="btn" id="logCopy" data-i18n="log.copy"></button>
        <button class="btn ghost" id="logClear" data-i18n="log.clear"></button>
      </div>
      <div id="logList" class="log"><p class="muted" data-i18n="log.emptyStart"></p></div>
    </section>

    <!-- ============ AJUSTES ============ -->
    <section id="tab-settings" class="panel">
      <label class="f"><span data-i18n="set.uiLang"></span>
        <select id="uiLang">
          <option value="auto" data-i18n="set.uiLang.auto"></option>
          <option value="es">Español</option>
          <option value="en">English</option>
        </select>
      </label>

      <div class="f" style="margin-top:8px"><span data-i18n="set.key"></span>
        <div class="row">
          <input type="password" id="setKey" placeholder="AIza..." autocomplete="off" spellcheck="false">
          <button class="btn icon" id="setToggle" data-i18n-title="common.showHide">👁</button>
        </div>
      </div>
      <div class="row">
        <button class="btn primary" id="setSaveKey" data-i18n="set.save"></button>
        <button class="btn" id="setWizard" data-i18n="set.guide"></button>
        <button class="btn" id="refreshModels" data-i18n="set.models" data-i18n-title="set.models.title"></button>
        <button class="btn ghost" id="setDeleteKey" data-i18n="set.delete"></button>
      </div>
      <div id="setStatus" class="status"></div>
      <p class="hint" id="keyInfo"></p>

      <details open>
        <summary data-i18n="set.quota"></summary>
        <div class="grid">
          <label class="f"><span id="limLabel"></span>
            <input type="number" id="limitRpd" min="1" step="1">
          </label>
          <div class="f"><span>&nbsp;</span><button class="btn" id="openLimits" data-i18n="set.limits"></button></div>
        </div>
        <p class="hint" data-i18n="set.quotaHint"></p>
      </details>

      <p class="hint">Config: <code id="cfgPath"></code><br>AutoSub 1.5.0</p>
    </section>
  </main>

  <script src="js/i18n.js"></script>
  <script src="js/cep.js"></script>
  <script src="js/secret.js"></script>
  <script src="js/config.js"></script>
  <script src="js/quota.js"></script>
  <script src="js/gemini.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/segment.js"></script>
  <script src="js/exporters.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
